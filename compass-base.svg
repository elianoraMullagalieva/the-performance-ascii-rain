<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Картографический компас</title>
  <desc id="desc">Тонкий гравюрный компас с концентрическими шкалами, точечной фактурой и координатными осями.</desc>
  <defs>
    <pattern id="microDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".65" fill="#171615" opacity=".36"/>
      <circle cx="9" cy="7" r=".42" fill="#171615" opacity=".22"/>
      <circle cx="5" cy="11" r=".38" fill="#171615" opacity=".18"/>
    </pattern>
    <filter id="softGrain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
    </filter>
  </defs>

  <g fill="none" stroke="#171615" stroke-linecap="round" stroke-linejoin="round">
    <!-- coordinate field -->
    <g stroke-width="1" opacity=".64">
      <path d="M34 300H566M300 34V566"/>
      <path d="M93 93L507 507M507 93L93 507" opacity=".54"/>
      <path d="M47 292h18M47 308h18M535 292h18M535 308h18M292 47v18M308 47v18M292 535v18M308 535v18"/>
    </g>
    <g opacity=".67">
      <circle cx="300" cy="300" r="206" stroke-width="1" stroke-dasharray="1 9"/>
      <circle cx="300" cy="300" r="190" stroke-width="1"/>
      <circle cx="300" cy="300" r="178" stroke-width="1" stroke-dasharray="1 4"/>
      <circle cx="300" cy="300" r="165" stroke-width="1.15"/>
      <circle cx="300" cy="300" r="155" stroke-width="1" stroke-dasharray=".5 4"/>
      <circle cx="300" cy="300" r="143" stroke-width="1.2"/>
      <circle cx="300" cy="300" r="127" stroke-width="1" stroke-dasharray="1 5"/>
      <circle cx="300" cy="300" r="115" stroke-width="1.2"/>
      <circle cx="300" cy="300" r="101" stroke-width="1" stroke-dasharray="1.2 3.5"/>
    </g>

    <!-- polar tick scales -->
    <g stroke-width="1" opacity=".82">
      <circle cx="300" cy="300" r="171" stroke-dasharray="2 4"/>
      <circle cx="300" cy="300" r="151" stroke-dasharray="1 3"/>
      <circle cx="300" cy="300" r="132" stroke-dasharray=".7 3.1"/>
      <circle cx="300" cy="300" r="108" stroke-dasharray="1 4.4"/>
    </g>

    <!-- cardinal markers -->
    <g stroke-width="1.45" opacity=".9">
      <path d="M300 88v40M300 472v40M88 300h40M472 300h40"/>
      <path d="M300 120l-7 9h14zM300 480l-7-9h14zM120 300l9-7v14zM480 300l-9-7v14z" fill="#171615"/>
      <circle cx="300" cy="120" r="3" fill="#f4f1ed"/><circle cx="480" cy="300" r="3" fill="#f4f1ed"/><circle cx="300" cy="480" r="3" fill="#f4f1ed"/><circle cx="120" cy="300" r="3" fill="#f4f1ed"/>
    </g>

    <!-- four technical sectors -->
    <g stroke-width="1" opacity=".76">
      <path d="M300 94A206 206 0 0 1 506 300M300 94A206 206 0 0 0 94 300M94 300A206 206 0 0 0 300 506M506 300A206 206 0 0 1 300 506" stroke-dasharray="3 6"/>
      <path d="M165 165l35 35M435 165l-35 35M165 435l35-35M435 435l-35-35"/>
      <path d="M158 189l24 10M442 189l-24 10M158 411l24-10M442 411l-24-10"/>
    </g>

    <!-- neutral inner seal: no typography, so the compass works as an independent artifact -->
    <circle cx="300" cy="300" r="88" fill="#f4f1ed" stroke-width="1.45"/>
    <circle cx="300" cy="300" r="81" stroke-width=".9" stroke-dasharray="1 3"/>
    <circle cx="300" cy="300" r="61" stroke-width="1"/>
    <path d="M239 300h122M300 239v122" stroke-width=".75" opacity=".5"/>
  </g>

  <!-- point wear and etching field -->
  <circle cx="300" cy="300" r="214" fill="url(#microDots)" opacity=".29"/>

</svg>
