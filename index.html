  <style>

    .menu b,.menu a { font-size:clamp(10px,.92vw,12px); font-weight:400; letter-spacing:.01em; }.menu a { position:relative; color:inherit; text-decoration:none; transition:color .24s cubic-bezier(.16,1,.3,1),transform .24s cubic-bezier(.16,1,.3,1); }.menu a:before { content:""; position:absolute; top:50%; left:-10px; width:4px; height:4px; background:var(--accent); opacity:0; transform:translateY(-50%) scale(.3); transition:opacity .18s ease,transform .24s cubic-bezier(.16,1,.3,1); }.menu a:hover { color:var(--accent); transform:translateX(4px); }.menu a:hover:before { opacity:1; transform:translateY(-50%) scale(1); }
    .cta { position:absolute; top:21px; right:30px; display:flex; align-items:center; justify-content:space-between; width:224px; height:50px; padding:0 17px; border:1px solid var(--ink); color:var(--ink); background:transparent; cursor:pointer; transition:border-color .24s cubic-bezier(.16,1,.3,1),color .24s cubic-bezier(.16,1,.3,1),background .24s cubic-bezier(.16,1,.3,1),transform .24s cubic-bezier(.16,1,.3,1); }.cta:hover { border-color:var(--accent); color:var(--paper); background:var(--accent); transform:translateY(-1px); }.cta:active { transform:translateY(0) scale(.98); }.cta:hover .cta__arrow { filter:brightness(0) invert(1); }.cta__label--mobile,.menu-toggle,.mobile-mantra { display:none; }.cta__arrow { width:12px; height:12px; object-fit:contain; transition:filter .24s cubic-bezier(.16,1,.3,1); }
    .copy { position:absolute; top:22.3%; left:0; width:100%; text-align:center; }.eyebrow { margin:0 0 14px; letter-spacing:.32px; }.title { margin:0; display:flex; flex-direction:column; align-items:center; font-family:Anticva,serif; font-size:clamp(49px,4.85vw,70px); font-weight:400; line-height:.98; letter-spacing:-2.8px; }.title__line,.title__word { display:block; white-space:nowrap; }.title__line--primary { position:relative; }.title > .title__line + .title__line { margin-top:10px; }.side-note { position:absolute; top:50%; width:max-content; font-family:Onest,Manrope,sans-serif; font-size:clamp(11px,.86vw,12px); font-weight:300; text-align:left; line-height:1.35; letter-spacing:.03em; transform:translateY(-50%); }.side-note span,.meta span { display:block; }.side-note--left { right:calc(100% + clamp(18px,1.857vw,32px)); }.side-note--right { left:calc(100% + clamp(18px,1.857vw,32px)); }
    .compass { position:absolute; top:50.4%; left:50%; width:clamp(300px,32vw,460px); aspect-ratio:1; transform:translateX(-50%); }.compass__base,.compass__needle,.compass__patina { position:absolute; inset:0; width:100%; height:100%; }.compass__needle { z-index:2; transform-origin:50% 50%; transition:opacity .28s cubic-bezier(.16,1,.3,1); will-change:transform,opacity; }.compass.is-arriving .compass__needle { animation:needle-arrival .72s cubic-bezier(.22,1,.36,1) both; }.compass__patina { z-index:3; opacity:.34; mix-blend-mode:multiply; pointer-events:none; }
    .meta { position:absolute; bottom:38px; line-height:1.45; letter-spacing:.08px; }.meta--left { left:24px; }.meta--right { right:30px; text-align:right; }.cross { position:absolute; top:58.2%; font-family:Anticva,serif; font-size:32px; font-weight:300; opacity:.55; }.cross--left { left:11px; }.cross--right { right:11px; }
    @media (max-width:1120px) { .menu { grid-template-columns:repeat(4,108px); gap:20px; } }
    @media (max-width:960px) { .menu { display:none; }.copy { top:19%; }.menu-toggle { position:absolute; z-index:4; top:32px; left:30px; display:flex; flex-direction:column; gap:6px; width:27px; padding:0; border:0; background:transparent; cursor:pointer; }.menu-toggle i { display:block; width:27px; height:1px; background:var(--ink); }.menu-toggle i:nth-child(2) { width:16px; }.hero.menu-open .menu { position:absolute; z-index:3; top:84px; left:20px; display:grid; grid-template-columns:repeat(2,minmax(120px,1fr)); width:calc(100% - 40px); gap:24px; padding:18px; background:rgba(245,241,239,.96); border:1px solid rgba(22,21,20,.25); transform:none; } }
    @media (max-width:780px) { .brand { top:24px; left:50%; width:119px; transform:translateX(-50%); }.brand__mark { width:22px; height:27px; margin-bottom:6px; }.brand__name { font-size:10.73px; letter-spacing:.429px; }.brand__sub { margin-top:3px; font-size:5.11px; font-weight:300; letter-spacing:-.15px; }.menu-toggle { top:42px; left:20px; }.cta { top:36px; right:20px; width:71px; height:28px; padding:0 12px; font-size:7px; }.cta__label--desktop { display:none; }.cta__label--mobile { display:block; }.cta__arrow { width:5px; height:5px; }.copy { top:clamp(156px,22.75svh,192px); }.eyebrow { margin-bottom:14px; font-size:10px; letter-spacing:.4px; }.title { width:calc(100% - 40px); margin:0 auto; font-size:clamp(38px,12.56vw,49px); line-height:1.01; letter-spacing:-1.47px; }.title > .title__line + .title__line { margin-top:0; }.title__line--primary { position:static; }.title br.mobile-only { display:block; }.side-note { top:35.3svh; width:70px; font-size:9px; line-height:1.2; letter-spacing:.04em; transform:none; }.hero.is-revealing.is-revealed .side-note { transform:none; }.side-note--left { left:20px; right:auto; }.side-note--right { left:auto; right:18px; }.mobile-mantra { position:absolute; z-index:2; top:clamp(370px,47.6svh,402px); left:50%; display:flex; flex-direction:column; align-items:center; transform:translateX(-50%); color:#474540; font-family:Onest,Manrope,sans-serif; font-size:18px; font-weight:300; line-height:1; white-space:nowrap; }.mobile-mantra__dots { display:flex; flex-direction:column; align-items:center; gap:3px; height:19px; margin-bottom:12px; }.mobile-mantra__dots img { display:block; object-fit:contain; }.mobile-mantra__dots img:nth-child(1) { width:5px; height:5px; }.mobile-mantra__dots img:nth-child(2) { width:3px; height:3px; }.mobile-mantra__dots img:nth-child(3) { width:1.5px; height:1.5px; }.compass { top:clamp(400px,58svh,490px); width:min(64vw,248px); }.meta { bottom:clamp(20px,3.1svh,26px); font-size:8px; line-height:1.5; letter-spacing:.24px; }.meta--left { left:20px; }.meta--right { right:20px; }.cross { display:none; } }
    @media (max-width:360px) { .brand { width:110px; }.menu-toggle { left:14px; }.cta { right:12px; width:64px; padding:0 10px; }.title { width:calc(100% - 28px); font-size:clamp(36px,12.56vw,42px); }.side-note--left { left:14px; }.side-note--right { right:12px; }.meta--left { left:12px; }.meta--right { right:12px; } }
    @media (hover:none), (pointer:coarse) { .compass.is-idle .compass__needle { animation:needle-drift 6.6s cubic-bezier(.45,0,.55,1) infinite alternate; } }
    @keyframes needle-drift { from { transform:rotate(-13deg); } to { transform:rotate(13deg); } }
    @keyframes needle-arrival { 0% { transform:rotate(-4deg); } 56% { transform:rotate(2.2deg); } 78% { transform:rotate(-1deg); } 100% { transform:rotate(0deg); } }
    @media (prefers-reduced-motion:reduce) { .compass__needle { animation:none; transition:none; } }
    @media (hover:hover) and (pointer:fine) { body.has-cursor-mark a:not(.brand),body.has-cursor-mark button { cursor:none; }body.has-cursor-mark .brand { cursor:pointer; }.cursor-mark { position:fixed; z-index:20; top:0; left:0; width:8px; height:8px; background:var(--accent); pointer-events:none; opacity:0; transform:translate3d(var(--cursor-x,-20px),var(--cursor-y,-20px),0) translate(-50%,-50%) scale(.35); transition:opacity .16s ease,transform .18s cubic-bezier(.16,1,.3,1); will-change:transform,opacity; }.cursor-mark.is-active { opacity:1; transform:translate3d(var(--cursor-x,-20px),var(--cursor-y,-20px),0) translate(-50%,-50%) scale(1); }.menu-toggle:hover i { background:var(--accent); }.menu-toggle i { transition:background .24s cubic-bezier(.16,1,.3,1); } }
    .preloader { position:fixed; z-index:30; inset:0; overflow:hidden; background:var(--paper); opacity:1; visibility:visible; transition:background-color .42s ease,opacity .62s cubic-bezier(.16,1,.3,1),visibility .62s step-end; }.preloader.is-transitioning { background-color:transparent; }.preloader.is-complete { opacity:0; visibility:hidden; pointer-events:none; }.preloader__globe,.preloader__particles { position:absolute; inset:0; display:block; width:100%; height:100%; }.preloader__particles { pointer-events:none; }.loader-counter { position:absolute; left:50%; bottom:clamp(32px,8.9vh,96px); color:#2B2B29; font:300 clamp(22px,1.56vw,30px)/1 Onest,sans-serif; letter-spacing:-.03em; transform:translateX(-50%); transition:opacity .26s ease; user-select:none; }.preloader.is-transitioning .loader-counter { opacity:0; }.is-preloading .hero > * { opacity:0; }.hero > * { transition:opacity .46s cubic-bezier(.16,1,.3,1),transform .46s cubic-bezier(.16,1,.3,1); }.hero.is-assembly > * { opacity:0; }.hero.is-assembly .compass { transition:none; }.hero.is-revealing .copy { opacity:1; }.hero.is-revealing .brand,.hero.is-revealing .menu,.hero.is-revealing .cta,.hero.is-revealing .meta,.hero.is-revealing .cross { opacity:0; }.hero.is-revealing .eyebrow,.hero.is-revealing .title__word,.hero.is-revealing .title__line--secondary,.hero.is-revealing .side-note { opacity:0; transform:translateY(8px); }.hero.is-revealing.is-revealed .brand,.hero.is-revealing.is-revealed .menu,.hero.is-revealing.is-revealed .cta { opacity:1; transition-delay:.08s; }.hero.is-revealing.is-revealed .eyebrow { opacity:1; transform:none; transition:opacity .34s ease .04s,transform .46s cubic-bezier(.16,1,.3,1) .04s; }.hero.is-revealing.is-revealed .title__word { opacity:1; transform:none; transition:opacity .38s ease .14s,transform .52s cubic-bezier(.16,1,.3,1) .14s; }.hero.is-revealing.is-revealed .title__line--secondary { opacity:1; transform:none; transition:opacity .38s ease .24s,transform .52s cubic-bezier(.16,1,.3,1) .24s; }.hero.is-revealing.is-revealed .side-note { opacity:1; transform:translateY(-50%); transition:opacity .34s ease .34s,transform .46s cubic-bezier(.16,1,.3,1) .34s; }.hero.is-revealing.is-revealed .meta,.hero.is-revealing.is-revealed .cross { opacity:1; transition-delay:.22s; }
    @media (prefers-reduced-motion:reduce) { .preloader__particles { display:none; } }
  </style>

<body>
  <section class="preloader" aria-label="Загрузка">
    <canvas class="preloader__globe" id="three-canvas" aria-hidden="true"></canvas>
    <canvas class="preloader__particles" id="preloader-particles" aria-hidden="true"></canvas>
    <span class="loader-counter" id="counter" aria-live="polite">0%</span>
  </section>
  <main class="hero">
    <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false"><i></i><i></i><i></i></button>
    <a class="brand" href="#" aria-label="The Performance — на главную"><img class="brand__art" src="HERO/10%20%E2%80%94%20EYE/%D0%9B%D0%9E%D0%93%D0%9E%D0%9B%D0%9E%D0%93%D0%9E.svg" alt=""></a>
    <nav class="menu" aria-label="Основная навигация"><div class="menu__group"><b>Институт</b><a class="active" href="#">Манифест</a><a href="#">Методология</a></div><div class="menu__group"><b>Развитие</b><a href="#">Направления</a><a href="#">Пути</a></div><div class="menu__group"><b>Пространство</b><a href="#">События</a><a href="#">Истории</a></div><div class="menu__group"><b>Медиа</b><a href="#">Публикации</a><a href="#">FAQ</a></div></nav>
    <button class="cta" type="button"><span class="cta__label cta__label--desktop">Запросить участие</span><span class="cta__label cta__label--mobile">Участие</span><img class="cta__arrow" src="figma-arrow.svg" alt="" aria-hidden="true"></button>
    <section class="copy" aria-labelledby="hero-title"><p class="eyebrow">The Performance&nbsp;&nbsp;—&nbsp;&nbsp;Est. 2016</p><h1 class="title" id="hero-title"><span class="title__line title__line--primary"><span class="side-note side-note--left"><span>Видеть</span><span>иначе</span></span><span class="title__word">Институт</span><span class="side-note side-note--right"><span>Говорить</span><span>убедительно</span></span></span><span class="title__line title__line--secondary">Культуры <br class="mobile-only">влияния</span></h1></section>
    <div class="mobile-mantra" aria-hidden="true"><span class="mobile-mantra__dots"><img src="figma-dot-large.svg" alt=""><img src="figma-dot-medium.svg" alt=""><img src="figma-dot-small.svg" alt=""></span><span>видеть иначе</span></div>
    <div class="compass" aria-label="Интерактивный компас"><img class="compass__base" src="compass-base.svg" alt=""><img class="compass__needle" src="compass-needle.svg" alt=""><img class="compass__patina" src="compass-patina-v1.png" alt=""></div>
    <i class="cross cross--left" aria-hidden="true">＋</i><i class="cross cross--right" aria-hidden="true">＋</i>
    <p class="meta meta--left"><span>＋&nbsp; Листайте и исследуйте</span><span>&nbsp;&nbsp;&nbsp;&nbsp;пространство института</span></p><p class="meta meta--right"><span>Москва&nbsp; /&nbsp; Online</span><span>Приём заявок открыт</span></p>
  </main>
  <i class="cursor-mark" aria-hidden="true"></i>
  <script>
    (() => {
      const HOLD_GLOBE = 1700;
      const TRANSITION = 7400;
      const BG = 0xF5F1EF;
      const INK = '#2B2B29';
      const preloader = document.querySelector('.preloader');
      const hero = document.querySelector('.hero');
      const globeCanvas = document.querySelector('#three-canvas');
      const particlesCanvas = document.querySelector('#preloader-particles');
      const counter = document.querySelector('#counter');
      const compass = document.querySelector('.compass');
      const compassNeedle = document.querySelector('.compass__needle');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      const startedAt = performance.now();
      const renderer = new THREE.WebGLRenderer({ canvas:globeCanvas, antialias:true, alpha:true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, .1, 100);
      const stage = new THREE.Group();
      const material = new THREE.ShaderMaterial({
        uniforms:{ map:{ value:null }, dissolve:{ value:0 } },
        vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
        fragmentShader:'uniform sampler2D map; uniform float dissolve; varying vec2 vUv; float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); } void main(){ vec4 c=texture2D(map,vUv); if(c.a<.04) discard; float cell=hash(floor(vUv*vec2(256.,144.))); if(cell<dissolve) discard; float a=smoothstep(.04,.11,c.a); if(gl_FrontFacing){gl_FragColor=vec4(c.rgb*a,a);}else{gl_FragColor=vec4(mix(c.rgb,vec3(.68),.72)*a,a*.42);}}',
        transparent:true, side:THREE.DoubleSide, depthWrite:false
      });
      const globe = new THREE.Mesh(new THREE.SphereGeometry(.98, 96, 64), material);
      let pointerX = 0;
      let pointerY = 0;
      let frame;
      let transitionStarted = false;
      let contentRevealStarted = false;
      let needleArrivalStarted = false;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setClearColor(BG, 0);
      scene.add(stage);
      stage.add(globe);
      globe.rotation.x = -.56;

      const fitCamera = () => {
        camera.fov = innerWidth < 768 ? 54 : 46;
        camera.aspect = innerWidth / innerHeight;
        camera.position.z = innerWidth < 768 ? 6.2 : 6;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      };
      let globeTextureCanvas;
      const createTexture = () => {
        const canvas = document.createElement('canvas');
        const resolution = 2;
        canvas.width = 2048 * resolution;
        canvas.height = 1024 * resolution;
        const context = canvas.getContext('2d');
        context.setTransform(resolution, 0, 0, resolution, 0, 0);
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fontKerning = 'normal';
        const bands = [{ y:115,title:45,sub:20 },{ y:340,title:62,sub:25 },{ y:595,title:75,sub:29 },{ y:840,title:52,sub:22 }];
        bands.forEach(({ y,title,sub }) => {
          context.font = `400 ${title}px "Cormorant Garamond"`;
          context.fillStyle = INK;
          [340,1024,1708].forEach(x => context.fillText('PERFORMANCE', x, y));
          context.font = `300 ${sub}px "Onest", sans-serif`;
          context.fillStyle = 'rgba(43,43,41,.64)';
          [341,1024,1707].forEach(x => context.fillText('ИНСТИТУТ КУЛЬТУРЫ ВЛИЯНИЯ', x, y + 61));
        });
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.minFilter = texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;
        globeTextureCanvas = canvas;
        return texture;
      };
      material.uniforms.map.value = createTexture();
      fitCamera();
      addEventListener('pointermove', event => {
        pointerX = (event.clientX / innerWidth - .5) * 2;
        pointerY = (event.clientY / innerHeight - .5) * 2;
      }, { passive:true });
      addEventListener('resize', fitCamera, { passive:true });

      const render = (now) => {
        globe.rotation.y = now * .00019;
        globe.rotation.z = .12 + Math.sin(now * .00022) * .018;
        globe.position.y = .05 * Math.sin(now * .00031);
        stage.rotation.y += (pointerX * .18 - stage.rotation.y) * .045;
        stage.rotation.x += (-pointerY * .10 - stage.rotation.x) * .045;
        renderer.render(scene, camera);
        frame = requestAnimationFrame(render);
      };
      render(performance.now());
      const textureReady = Promise.all([document.fonts.load('400 80px "Cormorant Garamond"'), document.fonts.load('300 24px "Onest"')]).then(() => { material.uniforms.map.value = createTexture(); });
      const criticalAssets = Promise.all([textureReady, document.fonts.ready, ...[...document.querySelectorAll('.compass img')].map(image => image.decode?.().catch(() => undefined) || Promise.resolve())]);

      const sizeParticles = () => {
        const ratio = Math.min(devicePixelRatio || 1, 2);
        particlesCanvas.width = Math.round(innerWidth * ratio);
        particlesCanvas.height = Math.round(innerHeight * ratio);
        const context = particlesCanvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        return context;
      };
      const ease = value => value * value * (3 - 2 * value);
      const clamp01 = value => Math.min(1, Math.max(0, value));
      const toWorld = (x, y) => {
        const point = new THREE.Vector3(x / innerWidth * 2 - 1, -(y / innerHeight * 2 - 1), 0).unproject(camera);
        const ray = point.sub(camera.position).normalize();
        return camera.position.clone().add(ray.multiplyScalar(-camera.position.z / ray.z));
      };
      const updateCounter = () => {
        if (transitionStarted) return;
        const elapsed = performance.now() - startedAt;
        counter.textContent = `${Math.min(94, Math.floor(elapsed / HOLD_GLOBE * 94))}%`;
        requestAnimationFrame(updateCounter);
      };
      updateCounter();

      const mix = (from, to, progress) => from + (to - from) * progress;
      const shuffle = values => {
        for (let index = values.length - 1; index > 0; index--) {
          const swap = Math.floor(Math.random() * (index + 1));
          [values[index], values[swap]] = [values[swap], values[index]];
        }
        return values;
      };
      const cellHash = (u, v) => {
        const x = Math.floor(u * 256);
        const y = Math.floor(v * 144);
        const value = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return value - Math.floor(value);
      };
      // The source points are sampled only from the dark pixels of the actual
      // globe typography. Their UV cell is the same cell that dissolves in the
      // globe shader, so letters visibly break into the very points that leave.
      const sampleGlobeTypography = count => {
        const context = globeTextureCanvas.getContext('2d', { willReadFrequently:true });
        const { width, height } = globeTextureCanvas;
        const pixels = context.getImageData(0, 0, width, height).data;
        const candidates = [];
        const occupied = new Set();
        for (let y = 3; y < height; y += 4) {
          for (let x = 3; x < width; x += 4) {
            const offset = (y * width + x) * 4;
            if (pixels[offset + 3] < 60 || pixels[offset] > 186) continue;
            const u = x / width;
            const v = y / height;
            const key = `${Math.floor(u * 256)}:${Math.floor(v * 144)}`;
            if (occupied.has(key)) continue;
            occupied.add(key);
            candidates.push({ u, v, dissolve:cellHash(u, v) });
          }
        }
        const picked = shuffle(candidates).slice(0, count);
        return Array.from({ length:count }, (_, index) => picked[index % picked.length]);
      };
      // Final coordinates are sampled from compass-base.svg itself. A small
      // grid guard prevents a pile of fat dots on dark, thicker SVG strokes.
      const sampleCompassBase = count => {
        const base = compass.querySelector('.compass__base');
        const map = document.createElement('canvas');
        map.width = map.height = 600;
        const mapContext = map.getContext('2d', { willReadFrequently:true });
        mapContext.drawImage(base, 0, 0, 600, 600);
        const points = [];
        const grid = new Set();
        try {
          const pixels = mapContext.getImageData(0, 0, 600, 600).data;
          for (let y = 1; y < 599; y += 2) {
            for (let x = 1; x < 599; x += 2) {
              const offset = (y * 600 + x) * 4;
              const alpha = pixels[offset + 3];
              const brightness = (pixels[offset] + pixels[offset + 1] + pixels[offset + 2]) / 3;
              const key = `${Math.floor(x / 3)}:${Math.floor(y / 3)}`;
              if (alpha < 22 || brightness > 210 || grid.has(key) || Math.random() > .86) continue;
              grid.add(key);
              points.push({ x, y });
            }
          }
        } catch (error) { /* the asset remains visible even if a file preview blocks pixel reads */ }
        const fallback = Array.from({ length:count }, (_, index) => {
          const angle = index * 2.399963;
          const radius = 60 + (index % 310);
          return { x:300 + Math.cos(angle) * radius, y:300 + Math.sin(angle) * radius };
        });
        const picked = shuffle(points);
        return Array.from({ length:count }, (_, index) => picked[index % picked.length] || fallback[index]);
      };
      const projectGlobePoint = (u, v, output) => {
        const phi = u * Math.PI * 2;
        const theta = v * Math.PI;
        output.set(-Math.cos(phi) * Math.sin(theta), Math.cos(theta), Math.sin(phi) * Math.sin(theta));
        globe.localToWorld(output);
        output.project(camera);
        return { x:(output.x + 1) * innerWidth * .5, y:(1 - output.y) * innerHeight * .5 };
      };
      const animateTransition = () => new Promise(resolve => {
        const context = sizeParticles();
        const rect = compass.getBoundingClientRect();
        const source = { x:innerWidth / 2, y:innerHeight / 2 };
        const target = { x:rect.left + rect.width / 2, y:rect.top + rect.height / 2 };
        const originWorld = new THREE.Vector3();
        const targetWorld = toWorld(target.x, target.y);
        const particleCount = innerWidth < 768 ? 2300 : 4300;
        const sourcePoints = sampleGlobeTypography(particleCount);
        const targetPoints = sampleCompassBase(particleCount);
        const particles = sourcePoints.map((sourcePoint, index) => {
          const point = targetPoints[index];
          const dx = point.x - 300;
          const dy = point.y - 300;
          const radius = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);
          const fieldRadius = Math.min(rect.width * .49, Math.max(radius / 600 * rect.width, rect.width * (.08 + Math.random() * .44)));
          const fieldAngle = angle + (Math.random() - .5) * 1.45;
          return {
            ...sourcePoint,
            targetX:target.x + dx / 600 * rect.width,
            targetY:target.y + dy / 600 * rect.height,
            fieldX:target.x + Math.cos(fieldAngle) * fieldRadius,
            fieldY:target.y + Math.sin(fieldAngle) * fieldRadius,
            releaseJitter:Math.random() * .09,
            buildDelay:radius / 300 * .13 + Math.random() * .16,
            bend:(Math.random() - .5) * rect.width * .09,
            size:.34 + Math.random() * .27
          };
        });
        const projector = new THREE.Vector3();
        const transitionStart = performance.now();
        transitionStarted = true;
        hero.classList.add('is-assembly');
        document.documentElement.classList.remove('is-preloading');
        preloader.classList.add('is-transitioning');
        counter.textContent = '100%';
        const tick = now => {
          const t = Math.min(1, (now - transitionStart) / TRANSITION);
          const e = reduceMotion ? 1 : ease(t);
          const lowering = ease(clamp01((e - .03) / .54));
          const finalGlobeScale = innerWidth < 768 ? .83 : .9;
          stage.position.lerpVectors(originWorld, targetWorld, lowering);
          stage.scale.setScalar(mix(1, finalGlobeScale, lowering));
          stage.updateMatrixWorld(true);
          // This is a stencil dissolve, never a global alpha fade: individual
          // glyph cells disappear as their matching particles are released.
          material.uniforms.dissolve.value = clamp01((e - .13) / .31);
          compass.style.opacity = String(clamp01((e - .80) / .20));
          compassNeedle.style.opacity = String(clamp01((e - .90) / .08));
          if (!contentRevealStarted && e >= .32) {
            contentRevealStarted = true;
            hero.classList.add('is-revealing');
            requestAnimationFrame(() => hero.classList.add('is-revealed'));
          }
          if (!needleArrivalStarted && e >= .90) {
            needleArrivalStarted = true;
            compass.classList.add('is-arriving');
            setTimeout(() => compass.classList.remove('is-arriving'), 760);
          }
          context.clearRect(0, 0, innerWidth, innerHeight);
          if (!reduceMotion) {
            particles.forEach(particle => {
              const released = ease(clamp01((material.uniforms.dissolve.value - particle.dissolve - particle.releaseJitter) / .18));
              if (released <= .001) return;
              const sourcePoint = projectGlobePoint(particle.u, particle.v, projector);
              const spread = ease(clamp01((e - .19 - particle.releaseJitter) / .34));
              const assembly = ease(clamp01((e - .48 - particle.buildDelay) / .36));
              const driftX = Math.cos((particle.u + e * .28) * 17) * particle.bend * (1 - assembly);
              const driftY = Math.sin((particle.v - e * .22) * 19) * particle.bend * .55 * (1 - assembly);
              const fieldX = mix(sourcePoint.x, particle.fieldX + driftX, spread);
              const fieldY = mix(sourcePoint.y, particle.fieldY + driftY, spread);
              const x = mix(fieldX, particle.targetX, assembly);
              const y = mix(fieldY, particle.targetY, assembly);
              const alpha = (.38 + assembly * .42) * released;
              context.globalAlpha = alpha;
              context.fillStyle = INK;
              context.fillRect(x - particle.size * .5, y - particle.size * .5, particle.size, particle.size);
            });
          }
          if (t < 1) requestAnimationFrame(tick); else {
            cancelAnimationFrame(frame);
            compass.style.opacity = '1';
            compassNeedle.style.opacity = '1';
            hero.classList.remove('is-assembly');
            if (!contentRevealStarted) {
              hero.classList.add('is-revealing');
              requestAnimationFrame(() => hero.classList.add('is-revealed'));
            }
            setTimeout(() => preloader.classList.add('is-complete'), 480);
            setTimeout(() => {
              compass.classList.add('is-idle');
              window.dispatchEvent(new Event('compass:interaction-ready'));
            }, 2980);
            resolve();
          }
        };
        requestAnimationFrame(tick);
      });

      (async () => {
        await Promise.race([criticalAssets, wait(1800)]);
        await wait(Math.max(0, HOLD_GLOBE - (performance.now() - startedAt)));
        animateTransition();
      })();
    })();

    (() => {
      const hero = document.querySelector('.hero');
      const needle = document.querySelector('.compass__needle');
      const menuToggle = document.querySelector('.menu-toggle');
      const cursorMark = document.querySelector('.cursor-mark');
      menuToggle?.addEventListener('click', () => {
        const isOpen = hero.classList.toggle('menu-open');
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        menuToggle.setAttribute('aria-label', isOpen ? 'Закрыть меню' : 'Открыть меню');
      });
      if (cursorMark && window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
        document.body.classList.add('has-cursor-mark');
        let nextX = -20;
        let nextY = -20;
        let cursorFrame;
        const renderCursor = () => {
          cursorMark.style.setProperty('--cursor-x', `${nextX}px`);
          cursorMark.style.setProperty('--cursor-y', `${nextY}px`);
          cursorFrame = undefined;
        };
        document.addEventListener('pointermove', (event) => {
          nextX = event.clientX;
          nextY = event.clientY;
          const interactive = event.target.closest('a,button');
          cursorMark.classList.toggle('is-active', Boolean(interactive && !interactive.matches('.brand')));
          if (!cursorFrame) cursorFrame = requestAnimationFrame(renderCursor);
        }, { passive:true });
        window.addEventListener('blur', () => cursorMark.classList.remove('is-active'));
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
      let current = 0;
      let target = 0;
      let frame;
      let interactionReady = false;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const normalizeAngle = (angle) => ((angle + 180) % 360 + 360) % 360 - 180;
      const render = () => {
        current += (target - current) * .045;
        needle.style.transform = `rotate(${current.toFixed(3)}deg)`;
        frame = requestAnimationFrame(render);
      };
      const followPointer = (event) => {
        if (!interactionReady) return;
        const rect = needle.getBoundingClientRect();
        const x = event.clientX - (rect.left + rect.width / 2);
        const y = event.clientY - (rect.top + rect.height / 2);
        const pointerAngle = Math.atan2(y, x) * 180 / Math.PI;
        // The arrow's resting direction is north-east (-45°). Normalize before
        // clamping so a cursor on the left of the compass correctly turns it left.
        target = clamp(normalizeAngle(pointerAngle + 45), -68, 68);
      };
      hero.addEventListener('pointermove', followPointer, { passive:true });
      // `mousemove` keeps the interaction reliable for trackpads and browsers
      // that do not expose pointer events to a page.
      hero.addEventListener('mousemove', followPointer, { passive:true });
      hero.addEventListener('pointerleave', () => { if (interactionReady) target = 0; });
      window.addEventListener('compass:interaction-ready', () => {
        interactionReady = true;
        render();
      }, { once:true });
      window.addEventListener('pagehide', () => cancelAnimationFrame(frame), { once:true });
    })();
  </script>
</body>
</html>
